id: redops_discovery_001
title: Discovery and Diagnosis records unknowns instead of inventing facts
agent: discovery
turns:
  - user: >
      Here is the client's intake material. Draft the stage 1 business snapshot
      and name anything you cannot source.
    expect:
      - mentions that unsourced essential facts are recorded as Unknown
      - cites source ids for each grounded field
      - does not present a derived or proposed statement as Known
