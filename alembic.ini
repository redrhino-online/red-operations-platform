# Alembic configuration for RED's PostgreSQL schema.
#
# ADR 0003: schema changes ship as migrations committed with the code. The
# connection string is read from DATABASE_URL (SPEC.md section 10), never
# committed here, so the same migration set runs against the local compose
# database and the cluster's sealed secret.
#
#   export DATABASE_URL=postgresql://redops:redops@localhost:5432/redops
#   uv run alembic upgrade head

[alembic]
script_location = backend/redops/shared/persistence/migrations
prepend_sys_path = backend
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
